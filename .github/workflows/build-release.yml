name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.17)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/tarball/$RELEASE_TAG" \
            -o "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.3 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare macOS signing
        env:
          CELLS_REQUIRE_SIGNING: '1'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node scripts/prepare-macos-signing.mjs

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Using Apple ID notarization credentials"
            xcrun notarytool store-credentials "cells-ci-notary" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            echo "CELLS_NOTARY_PROFILE=cells-ci-notary" >> "$GITHUB_ENV"
          elif [ -n "${APPLE_API_KEY_CONTENT:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
            chmod 600 "$APPLE_API_KEY_PATH"
            openssl pkey -in "$APPLE_API_KEY_PATH" -noout >/dev/null
            xcrun notarytool store-credentials "cells-ci-notary" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER"
            echo "CELLS_NOTARY_PROFILE=cells-ci-notary" >> "$GITHUB_ENV"
          else
            echo "Apple notarization credentials are required for Cells release builds."
            exit 1
          fi

      - name: Package Cells
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CELLS_REQUIRE_NOTARIZATION: '1'
        run: pnpm pack:cells

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { writeFileSync } = require("node:fs");

          const repo = process.env.GITHUB_REPOSITORY;
          const refName = process.env.RELEASE_TAG;
          const sha = process.env.GITHUB_SHA;
          const releases = JSON.parse(
            execFileSync("gh", [
              "release",
              "list",
              "--repo",
              repo,
              "--exclude-drafts",
              "--exclude-pre-releases",
              "--limit",
              "50",
              "--json",
              "tagName",
            ], { encoding: "utf8" }),
          );
          const semver = /^v\d+\.\d+\.\d+$/;
          const prevTag =
            releases
              .map((release) => release.tagName)
              .filter((tag) => semver.test(tag) && tag !== refName)
              .sort((a, b) =>
                b.localeCompare(a, undefined, { numeric: true, sensitivity: "base" }),
              )[0] ?? "";

          const fullChangelogUrl = prevTag
            ? `https://github.com/${repo}/compare/${prevTag}...${refName}`
            : `https://github.com/${repo}/commits/${sha}`;

          const endpoint = prevTag
            ? `repos/${repo}/compare/${prevTag}...${refName}`
            : `repos/${repo}/commits?sha=${sha}&per_page=100`;

          const response = JSON.parse(
            execFileSync("gh", ["api", endpoint], { encoding: "utf8" }),
          );
          const commits = Array.isArray(response) ? response : response.commits ?? [];
          const changelogItems = commits
            .map((commit) => commit.commit?.message?.split("\n")[0]?.trim())
            .filter(Boolean)
            .filter((message) => !message.startsWith("release:") && !message.startsWith("Merge"))
            .map((message) => `- ${message}`);
          const changelog = changelogItems.length
            ? changelogItems.join("\n")
            : "- Maintenance and bug fixes";

          const contributors = [];
          const seen = new Set();

          for (const commit of commits) {
            const login = commit.author?.login?.trim();
            const name = commit.commit?.author?.name?.trim();
            const key = login
              ? `login:${login.toLowerCase()}`
              : name
                ? `name:${name}`
                : null;

            if (!key || seen.has(key)) {
              continue;
            }

            seen.add(key);

            if (login) {
              const label =
                name && name.toLowerCase() !== login.toLowerCase()
                  ? `${name} (@${login})`
                  : `@${login}`;
              contributors.push(`- [${label}](https://github.com/${login})`);
              continue;
            }

            if (name) {
              contributors.push(`- ${name}`);
            }
          }

          const contributorSection = contributors.length
            ? contributors.join("\n")
            : "- No external contributors recorded";

          const body = [
            "## What's Changed",
            "",
            changelog,
            "",
            "## Contributors",
            "",
            contributorSection,
            "",
            `**Full Changelog**: ${fullChangelogUrl}`,
          ].join("\n") + "\n";
          writeFileSync("release-notes.md", body);
          NODE

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "${RELEASE_TAG#v}" \
              --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --title "${RELEASE_TAG#v}" \
            --notes-file release-notes.md

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Find and upload all built artifacts and updater metadata for this runner.
          for file in release/*.zip release/*.dmg release/latest-mac.yml; do
            if [ -f "$file" ]; then
              echo "Uploading artifact: $(basename "$file")"
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          done
