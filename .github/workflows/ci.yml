name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Download source
        env:
          SOURCE_REF: ${{ github.sha }}
        run: |
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$SOURCE_REF.tar.gz" \
            -o "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.3 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
