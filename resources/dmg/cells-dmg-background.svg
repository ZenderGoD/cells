<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="74%">
      <stop offset="0%" stop-color="#0b0d11"/>
      <stop offset="58%" stop-color="#06070a"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>
    <radialGradient id="iconPool" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#161a22" stop-opacity="0.96"/>
      <stop offset="78%" stop-color="#090b10" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#050609" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="52%" stop-color="#7f8da7" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7a9cff"/>
      <stop offset="100%" stop-color="#66e3d4"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#9aa6bc" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="720" height="720" fill="#020304"/>
  <g transform="translate(0 140)">
    <rect width="720" height="440" fill="url(#bg)"/>
    <rect width="720" height="440" fill="url(#grid)" opacity="0.38"/>
    <rect x="0.5" y="0.5" width="719" height="439" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>

    <text
      x="360"
      y="58"
      fill="#f1f3f7"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, Helvetica, Arial, sans-serif"
      font-size="23"
      font-weight="620"
      letter-spacing="-0.1"
      text-anchor="middle"
    >Drag Cells to Applications</text>

    <text
      x="360"
      y="88"
      fill="#707782"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, Helvetica, Arial, sans-serif"
      font-size="12.5"
      font-weight="450"
      letter-spacing="0"
      text-anchor="middle"
    >Install once, then launch from your Applications folder.</text>

    <g opacity="0.85" filter="url(#softGlow)">
      <ellipse cx="180" cy="231" rx="130" ry="94" fill="#1f2a3b" opacity="0.18"/>
      <ellipse cx="540" cy="231" rx="130" ry="94" fill="#16322f" opacity="0.16"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="80" y="146" width="200" height="170" rx="48" fill="url(#iconPool)" stroke="url(#stroke)" stroke-width="1"/>
      <rect x="440" y="146" width="200" height="170" rx="48" fill="url(#iconPool)" stroke="url(#stroke)" stroke-width="1"/>
    </g>

    <g opacity="0.42">
      <rect x="124" y="176" width="112" height="112" rx="30" fill="none" stroke="#8d96a8" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round"/>
      <rect x="484" y="176" width="112" height="112" rx="30" fill="none" stroke="#8d96a8" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round"/>
    </g>

    <g stroke="url(#arrow)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 320 231 H 400"/>
      <path d="M 391 222 L 400 231 L 391 240"/>
    </g>
    <circle cx="320" cy="231" r="3.2" fill="#7a9cff"/>

    <text
      x="360"
      y="375"
      fill="#7d8490"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, Helvetica, Arial, sans-serif"
      font-size="13"
      font-weight="450"
      letter-spacing="0"
      text-anchor="middle"
    >Then open Cells from Applications</text>
  </g>
</svg>
